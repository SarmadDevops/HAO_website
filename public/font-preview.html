<!doctype html>
<!-- TEMPORARY typography comparison, published at /font-preview.html for client review.
     Copied from /font-preview.html into public/. Not linked from navigation or sitemap. Delete when done. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HAO Font Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Outfit:wght@600;700;800&family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&family=Open+Sans:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --primary: #12784a; --primary-dark: #0e3a26; --primary-soft: #e7f3ec;
      --secondary: #a23235; --accent: #f5a932; --dark: #10251b; --ink: #1c2420;
      --light: #faf7f1; --muted: #56625c; --border: #e4ded2;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: var(--ink); font-family: system-ui, sans-serif; }
    .label { position: sticky; top: 0; z-index: 2; background: var(--primary-dark); color: #fff;
      padding: 10px 16px; font: 600 14px/1.4 system-ui, sans-serif; letter-spacing: .02em; }
    .combo { border-bottom: 8px solid var(--border); font-family: var(--body); font-size: 1.0625rem; line-height: 1.65; }
    .h { font-family: var(--head); color: var(--dark); letter-spacing: -0.02em; text-wrap: balance; overflow-wrap: break-word; margin: 0; }
    nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
      padding: 14px clamp(16px, 4vw, 48px); border-bottom: 1px solid var(--border); }
    .brand { font-family: var(--head); font-weight: 800; color: var(--dark); }
    .brand small { display: block; font-size: 11px; letter-spacing: .14em; color: var(--primary); font-weight: 700; }
    .links { display: flex; gap: 22px; flex-wrap: wrap; font-weight: 500; font-size: .95rem; }
    .links a { color: var(--ink); text-decoration: none; }
    .links a.active { color: var(--primary); }
    .wrap { padding: clamp(32px, 6vw, 72px) clamp(16px, 4vw, 48px); max-width: 1240px; margin: 0 auto; }
    .hero { background: var(--light); }
    .eyebrow { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: .875rem;
      font-weight: 600; text-transform: uppercase; letter-spacing: .14em; color: var(--primary); }
    .eyebrow::before { content: ""; width: 24px; height: 2px; background: var(--accent); }
    .hero .h { font-size: clamp(2.6rem, 1.6rem + 4vw, 4.4rem); font-weight: 800; line-height: 1.05; max-width: 14ch; }
    .lead { color: var(--muted); font-size: clamp(1.0625rem, 1rem + 0.3vw, 1.1875rem); max-width: 36rem; margin: 20px 0 0; }
    .btns { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .btn { font-family: var(--head); display: inline-flex; align-items: center; min-height: 48px; padding: 12px 22px;
      border-radius: 6px; font-weight: 700; font-size: 1rem; border: 2px solid transparent; cursor: pointer; }
    .btn-donate { background: var(--secondary); color: #fff; }
    .btn-outline { background: transparent; border-color: var(--primary); color: var(--primary); }
    .btn-primary { background: var(--primary); color: #fff; }
    .section .h { font-size: clamp(2rem, 1.5rem + 2.2vw, 3rem); font-weight: 800; line-height: 1.1; max-width: 20ch; }
    .section p { max-width: 42rem; }
  </style>
</head>
<body>
  <template id="tpl">
    <nav>
      <div class="brand">Humanity Alliance<small>ORGANIZATION</small></div>
      <div class="links"><a class="active" href="#">Home</a><a href="#">About</a><a href="#">Projects</a><a href="#">Gallery</a><a href="#">News</a><a href="#">Contact</a></div>
      <button class="btn btn-donate">Donate Now</button>
    </nav>
    <div class="hero"><div class="wrap">
      <p class="eyebrow">Baitul Rehma | Hafizabad</p>
      <h1 class="h">Building Hope, Shaping Futures</h1>
      <p class="lead">Baitul Rehma is an upcoming humanitarian initiative by HAO, currently under construction in Hafizabad, Pakistan. Together, we're building a place of care, opportunity, and hope for communities in need.</p>
      <div class="btns"><button class="btn btn-donate">Support This Project</button><button class="btn btn-outline">Explore Baitul Rehma</button></div>
    </div></div>
    <div class="section"><div class="wrap">
      <p class="eyebrow">Donate for causes</p>
      <h2 class="h">Where Your Donation Makes a Difference</h2>
      <p>Your contributions directly support the humanitarian campaigns we are actively working on. From bringing clean water to underserved communities to creating better educational opportunities for children, every donation helps turn essential needs into meaningful change.</p>
      <div class="btns"><button class="btn btn-primary">Apply as Volunteer</button></div>
    </div></div>
  </template>

  <div id="out"></div>
  <script>
    const combos = [
      ["0. Current: Plus Jakarta Sans + DM Sans", "Plus Jakarta Sans", "DM Sans"],
      ["1. Manrope (headings) + Inter (body)", "Manrope", "Inter"],
      ["2. Outfit (headings) + Inter (body)", "Outfit", "Inter"],
      ["3. Montserrat (headings) + Open Sans (body)", "Montserrat", "Open Sans"],
    ];
    const tpl = document.getElementById("tpl");
    const out = document.getElementById("out");
    for (const [label, head, body] of combos) {
      const sec = document.createElement("section");
      sec.className = "combo";
      sec.style.setProperty("--head", `"${head}", system-ui, sans-serif`);
      sec.style.setProperty("--body", `"${body}", system-ui, sans-serif`);
      sec.innerHTML = `<div class="label">${label}</div>`;
      sec.appendChild(tpl.content.cloneNode(true));
      out.appendChild(sec);
    }
  </script>
</body>
</html>
